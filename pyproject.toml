[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minismt"
version = "0.3.1"
description = "DPLL(T) SMT solver for QF_UF in Python: CDCL, congruence closure, SMT-LIB. Educational, zero deps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ratul Rahman", email = "hi@ratul.fi" }]
keywords = ["smt", "sat", "solver", "dpll", "cdcl", "congruence-closure", "euf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy", "hypothesis>=6", "z3-solver>=4.12"]

[project.scripts]
minismt = "minismt.__main__:main"

[project.urls]
Homepage = "https://github.com/heyrtl/minismt"
Issues = "https://github.com/heyrtl/minismt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/minismt"]

[tool.pytest.ini_options]
testpaths = ["tests"]